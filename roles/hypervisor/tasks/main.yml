##### Dependency setup #####

- name: Create ZFS dataset to hold VM templates
  community.general.zfs:
    name: main-storage/vm-templates
    state: present

- name: Create folder storage for VM templates
  community.proxmox.proxmox_storage:
    nodes:
      - olympus
    name: vm-templates
    type: dir
    content:
      - vztmpl
    dir_options:
      path: /main-storage/vm-templates

- name: Fetch ubuntu image into storage
  community.proxmox.proxmox_template:
    node: olympus
    storage: vm-templates
    template: ubuntu-26.04-standard_26.04-1_amd64.tar.zst

- name: Add WakeMeOps repository
  ansible.builtin.deb822_repository:
    name: wakemeops
    types: deb
    enabled: true
    architectures: amd64
    components:
      - dev
      - devops
      - secops
      - terminal
      - desktop
    suites: stable
    uris: http://deb.wakemeops.com/wakemeops/
    signed_by: "{{ lookup('file', 'wakemeops_pgp.txt') }}"

- name: Install apt packages
  ansible.builtin.apt:
    update_cache: true
    name:
      - rclone
      - resticprofile

####### Set up automated backups ########

- name: Create directory for restic config
  ansible.builtin.file:
    path: /opt/backup
    state: directory
    
- name: Copy restic backup configuration
  ansible.builtin.copy:
    src: profiles.toml
    dest: /opt/backup/profiles.toml
    owner: root
    group: root
  notify:
    - Reschedule restic

- name: Initialize restic if it hasn't been initialized already
  ansible.builtin.shell:
    creates: /opt/backup/.restic_initialized
    chdir: /opt/backup/
    cmd: resticprofile init && touch .restic_initialized

####### Initialize LXCs #########

- name: Create Home Assistant LXC
  ansible.builtin.include_role:
    name: proxmox_ent
    tasks_from: lxc
    defaults_from: lxc
  vars:
    proxmox_container_id: 113
    proxmox_container_hostname: hass
    proxmox_container_disksize_gb: 10
    proxmox_container_cpu_cores: 2
    proxmox_container_networking:
      net2: "name=iot0,bridge=vmbr0,firewall=1,ip=dhcp,tag=3"
      net3: "name=priv0,bridge=vmbr0,firewall=1,ip=dhcp"



