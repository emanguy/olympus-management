- hosts: olympus_local
  module_defaults:
    group/community.proxmox.proxmox:
      api_host: "{{ proxmox_api_host }}"
      api_user: "{{ proxmox_user }}"
      api_password: "{{ proxmox_api_password }}"
      validate_certs: false
  roles:
    - hypervisor

- hosts: postgres
  roles:
    - postgres_db

- hosts: docker
  tasks:
    - name: Set up mealie server
      ansible.builtin.include_role:
        name: docker
        tasks_from: mealie

- hosts: hass
  roles:
    - docker
  tasks:
    - name: Set up home assistant
      ansible.builtin.include_role:
        name: docker
        tasks_from: home_assistant
        
